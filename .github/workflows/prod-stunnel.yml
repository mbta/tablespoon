name: Deploy Stunnel

on:
  workflow_dispatch:

concurrency:
  group: deploy-prod-stunnel
  cancel-in-progress: true

permissions:
  contents: read # private repo, needs permission to read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      ECS_CLUSTER: linux-prod
      ECS_SERVICE: stunnel-prod
    permissions:
      contents: read
      id-token: write # Needed to communicate with AWS

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mbta/actions/deploy-ecs@d37877022d4ae12e96663d2e0a970a5214a2e232 # v2.20
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          ecs-cluster: ${{ env.ECS_CLUSTER }}
          ecs-service: ${{ env.ECS_SERVICE }}
          docker-tag: ghcr.io/mbta/stunnel:5.72-r0-alpine-3.19.1
          launch-type: EXTERNAL
      - uses: mbta/actions/notify-slack-deploy@d37877022d4ae12e96663d2e0a970a5214a2e232 # v2.20
        if: ${{ !cancelled() }}
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          job-status: ${{ job.status }}
